[project]
name = "mammo-seg"
version = "0.1.0"
description = "Segmentation of mammography images with PyTorch."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mammo_seg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --strict-markers --import-mode=importlib"
markers = [
    "integration: runs a full workflow end to end on synthetic data",
    "slow: takes more than about 30 seconds",
]

[tool.coverage.run]
source = ["mammo_seg"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# Name modules by their path, so conftest.py files in different folders do not clash.
explicit_package_bases = true
mypy_path = "src"
