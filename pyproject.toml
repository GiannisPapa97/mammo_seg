[project]
name = "mammo-seg"
version = "0.1.0"
description = "Segmentation of mammography images with PyTorch."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pydicom>=3.0.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
]

# PyTorch comes in builds for a CPU or a CUDA version, from separate package
# indexes, so it is an extra: choose exactly one. Locally and in CI:
# `uv sync --extra cpu`. On a GPU machine: `--extra cu126` (older drivers) or
# `--extra cu130`. On Kaggle or Colab, where a GPU build of PyTorch is already
# installed, use `pip install ".[cloud]"`: it adds the model library and leaves the
# installed PyTorch alone.
[project.scripts]
mammo-seg = "mammo_seg.cli:main"

[project.optional-dependencies]
cpu = ["torch>=2.2", "torchvision>=0.17", "segmentation-models-pytorch>=0.5"]
cu126 = ["torch>=2.2", "torchvision>=0.17", "segmentation-models-pytorch>=0.5"]
cu130 = ["torch>=2.2", "torchvision>=0.17", "segmentation-models-pytorch>=0.5"]
cloud = ["torch>=2.2", "torchvision>=0.17", "segmentation-models-pytorch>=0.5"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mypy>=1.13",
    "nbstripout>=0.9.1",
    "pandas-stubs>=3.0.5.260914",
    "pyarrow>=26.0.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mammo_seg"]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu126" },
        { extra = "cu130" },
        { extra = "cloud" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov --strict-markers --import-mode=importlib"
# Delete the temporary files of passing tests; some tests write model checkpoints.
tmp_path_retention_policy = "failed"
markers = [
    "integration: runs a full workflow end to end on synthetic data",
    "slow: takes more than about 30 seconds",
]

[tool.coverage.run]
source = ["mammo_seg"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
# The command-line entry point is only a call to main(), which is tested.
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# Name modules by their path, so conftest.py files in different folders do not clash.
explicit_package_bases = true
mypy_path = "src"

# These libraries ship no type information
[[tool.mypy.overrides]]
module = [
    "sklearn",
    "sklearn.*",
    "scipy",
    "scipy.*",
    "torchvision",
    "torchvision.*",
    "segmentation_models_pytorch",
    "segmentation_models_pytorch.*",
]
ignore_missing_imports = true
